plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def secrets = new java.util.Properties()
def secretsFile = rootProject.file("secrets.properties")
if (secretsFile.exists()) {
    secretsFile.withInputStream { secrets.load(it) }
}
def signingStoreFile = project.file(secrets.getProperty("SIGNING_STORE_FILE", "../demo.jks"))
def hasSigningStore = signingStoreFile.exists()

static def getCurrentTime() {
    return new Date().format("yyyy-MM-dd-HH-mm", TimeZone.getTimeZone("GMT+08:00"))
}

android {
    namespace 'ai.guiji.duix.test'
    compileSdk 34
    ndkVersion '25.1.8937393'

    defaultConfig {
        applicationId "ai.guiji.duix.test"
        minSdk 24
        targetSdk 34
        versionCode 13
        versionName '4.1.1'
        buildConfigField "String", "DASHSCOPE_API_KEY", "\"${secrets.getProperty('DASHSCOPE_API_KEY', '')}\""
        buildConfigField "String", "MONITOR_BASE_URL", "\"${secrets.getProperty('MONITOR_BASE_URL', 'https://digital-human.xn--876a.net')}\""
    }

    signingConfigs {
        release {
            if (hasSigningStore) {
                storeFile signingStoreFile
                storePassword secrets.getProperty("SIGNING_STORE_PASSWORD", "")
                keyAlias secrets.getProperty("SIGNING_KEY_ALIAS", "demo")
                keyPassword secrets.getProperty("SIGNING_KEY_PASSWORD", "")
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasSigningStore) {
                signingConfig signingConfigs.release
            }
        }
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasSigningStore) {
                signingConfig signingConfigs.release
            }

            applicationVariants.all { variant ->
                variant.outputs.all {
                    outputFileName = "duix_mobile_test_${buildType.name}_${getCurrentTime()}_${defaultConfig.versionName}.apk"
                }
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }
    composeOptions {
        kotlinCompilerExtensionVersion '1.4.3'
    }
    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }

    lint {
        baseline = file("lint-baseline.xml")
    }
    lintOptions{
        checkReleaseBuilds false
    }
}

dependencies {

    implementation fileTree(include: ['*.jar', '*.aar'], dir: 'libs')
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.2.0'
    implementation 'com.google.android.material:material:1.4.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.1'
    implementation "androidx.activity:activity:1.3.0"
    implementation "androidx.fragment:fragment:1.3.0"
    implementation 'androidx.documentfile:documentfile:1.0.1'

    implementation 'com.github.bumptech.glide:glide:4.12.0'

    implementation project(":duix-sdk")
    implementation 'com.squareup.okhttp3:okhttp:4.10.0'
    implementation 'com.google.zxing:core:3.5.3'
}